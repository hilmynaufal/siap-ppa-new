# Basis data PostgreSQL untuk pengembangan lokal. Nilai di bawah hanya untuk lokal.
services:
  db:
    image: postgres:16
    container_name: siap-ppa-db
    environment:
      POSTGRES_USER: siap_ppa
      POSTGRES_PASSWORD: siap_ppa_dev
      POSTGRES_DB: siap_ppa
    ports:
      - "5439:5432"
    volumes:
      - siap_ppa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siap_ppa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  siap_ppa_data:
