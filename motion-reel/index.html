<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIAP PPA Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --bg:#05102b; --fg:#fff; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
  #wrap{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9}
  #stage{display:block;width:100%;height:100%;font-family:"Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer}
  #ctl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 16px;
       background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:opacity .25s;color:#fff;font:500 13px "JetBrains Mono",monospace}
  #wrap:hover #ctl{opacity:1}
  #ctl button{background:#d6247c;color:#fff;border:0;border-radius:8px;height:32px;min-width:64px;font:700 13px "Plus Jakarta Sans",sans-serif;cursor:pointer}
  #ctl input{flex:1;accent-color:#d6247c}
  .capture #ctl{display:none}
</style>
</head>
<body>
<div id="wrap">
  <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="ctl"><button id="pp">Jeda</button><input id="scrub" type="range" min="0" max="15" step="0.001" value="0"><span id="tc">00.00</span></div>
</div>
<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const T = 15, FPS = 30;
const CAPTURE = /capture/.test(location.search);
if (CAPTURE) document.documentElement.classList.add('capture');

/* ---------- palette (DESIGN.md) ---------- */
const C = {
  navy950:'#0A1B44', navy900:'#0F2A63', navy800:'#17387F', blue600:'#2F6FED', blue50:'#EAF1FF',
  mag600:'#D6247C', mag700:'#B81B68', mag100:'#FFD6EA', pink:'#FF6FB0',
  teal:'#0E9F8E', green:'#1E9E5A', amber:'#F5B014', violet:'#7A4FD6', sky:'#1E9BE0', coral:'#F26A4B',
  ink:'#1B2540', inkMute:'#5B6682', canvas:'#F2F6FF', surface:'#FBFCFF', line:'#D9E2F5', lineStrong:'#BCCAE6',
  success50:'#E3F5EA', deep:'#05102b'
};
const CONF = [C.mag600, C.blue600, C.teal, C.amber, C.violet, C.sky, C.coral, C.pink];

/* ---------- math ---------- */
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const lerp = (a,b,x) => a + (b-a)*x;
const P = (t,a,b) => clamp((t-a)/(b-a));
const E = {
  outExpo: x => x>=1 ? 1 : 1-Math.pow(2,-10*x),
  inExpo: x => x<=0 ? 0 : Math.pow(2,10*x-10),
  inOutExpo: x => x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outCubic: x => 1-Math.pow(1-x,3),
  inCubic: x => x*x*x,
  inOutCubic: x => x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  inQuad: x => x*x,
  outBack: x => { const c1=1.9, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); },
  spring: x => x<=0 ? 0 : x>=1 ? 1 : 1-Math.exp(-6.5*x)*Math.cos(13*x),
  outBounce: x => { const n=7.5625,d=2.75;
    if (x<1/d) return n*x*x; if (x<2/d) return n*(x-=1.5/d)*x+.75;
    if (x<2.5/d) return n*(x-=2.25/d)*x+.9375; return n*(x-=2.625/d)*x+.984375; }
};
function rng(seed){ let s = seed>>>0; return () => { s = (s*1664525+1013904223)>>>0; return s/4294967296; }; }
function mix(a,b,x){ const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const A=h(a),B=h(b);
  return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(x))).toString(16).padStart(2,'0')).join(''); }

/* ---------- dom helpers ---------- */
const svg = document.getElementById('stage');
function el(tag, attrs, parent, text){ const e=document.createElementNS(NS,tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text!=null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
function set(e, attrs){ for (const k in attrs) e.setAttribute(k, attrs[k]); }
function show(e, on){ e.style.display = on ? '' : 'none'; }
function txt(parent, s, x, y, size, weight, fill, extra){ return el('text', Object.assign({x, y, 'font-size':size, 'font-weight':weight, fill}, extra||{}), parent, s); }
const TF = (x,y,s=1,r=0) => `translate(${x} ${y}) rotate(${r}) scale(${s})`;

let render = () => {};

async function init(){
  try { await Promise.all([
    document.fonts.load('800 100px "Plus Jakarta Sans"'), document.fonts.load('700 100px "Plus Jakarta Sans"'),
    document.fonts.load('400 100px "Plus Jakarta Sans"'), document.fonts.load('500 20px "JetBrains Mono"')]);
    await document.fonts.ready; } catch(e){}

  /* ===== defs ===== */
  const defs = el('defs', null, svg);
  defs.innerHTML = `
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.mag600}" stop-opacity="0"/><stop offset="1" stop-color="${C.mag600}" stop-opacity=".35"/></linearGradient>
    <filter id="mblur" x="-20%" y="0" width="140%" height="100%"><feGaussianBlur id="mblurG" stdDeviation="0 0"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#0A1B44" flood-opacity=".28"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <path id="ringPath" d="M1530,540 m-230,0 a230,230 0 1,1 460,0 a230,230 0 1,1 -460,0"/>
    <clipPath id="screenClip"><rect x="-196" y="-396" width="392" height="792" rx="52"/></clipPath>
    <clipPath id="btnClip"><rect x="28" y="690" width="336" height="60" rx="14"/></clipPath>`;

  const bg = el('rect', {x:-50,y:-50,width:2020,height:1180,fill:C.navy950}, svg);
  const cam = el('g', null, svg);

  /* ================= S1 — NAUNGAN ================= */
  const s1 = el('g', null, cam);
  const grid = el('g', null, s1); const gridDots = [];
  for (let gy=0; gy<19; gy++) for (let gx=0; gx<33; gx++) {
    const x = gx*60, y = gy*60;
    gridDots.push({e: el('circle',{cx:x,cy:y,r:2.2,fill:'#fff'}, grid), d: Math.hypot(x-960,y-560)});
  }
  const rings1 = [C.mag600, C.blue600, '#fff'].map(c => el('circle',{cx:960,cy:560,fill:'none',stroke:c}, s1));
  const logo1 = el('g', null, s1);
  const archL = el('path',{d:'M56 218V124A72 72 0 0 1 128 52',fill:'none',stroke:'#fff','stroke-width':42,'stroke-linecap':'round'}, logo1);
  const archR = el('path',{d:'M200 218V124A72 72 0 0 0 128 52',fill:'none',stroke:'#fff','stroke-width':42,'stroke-linecap':'round'}, logo1);
  const dot1 = el('ellipse',{cx:128,cy:154,rx:32,ry:32,fill:C.mag600}, logo1);
  const archLen = archL.getTotalLength();
  [archL, archR].forEach(a => a.setAttribute('stroke-dasharray', archLen+' '+archLen));

  /* ================= S2 — PESAN ================= */
  const s2 = el('g', null, cam);
  const ringG = el('g', null, s2);
  el('circle',{cx:1530,cy:540,r:262,fill:'none',stroke:'#fff','stroke-opacity':.35,'stroke-width':2}, ringG);
  el('circle',{cx:1530,cy:540,r:198,fill:'none',stroke:'#fff','stroke-opacity':.35,'stroke-width':2}, ringG);
  const ringTextG = el('g', null, ringG);
  const rt = el('text',{'font-size':30,'font-weight':800,fill:'#fff','letter-spacing':7}, ringTextG);
  el('textPath',{href:'#ringPath'}, rt, 'SIAP PPA · KABUPATEN BANDUNG · ANDA TIDAK SENDIRI · ');
  const ringLogo = el('g', null, ringG);
  el('path',{d:'M56 218V124a72 72 0 0 1 144 0v94',fill:'none',stroke:C.navy950,'stroke-width':42,'stroke-linecap':'round'}, ringLogo);
  el('circle',{cx:128,cy:154,r:32,fill:'#fff'}, ringLogo);

  const words = [['Anda',400],['tidak',620],['sendiri',840]].map(([w,y],i) => {
    const cp = el('clipPath',{id:'wc'+i}, defs); el('rect',{x:0,y:y-205,width:1500,height:262}, cp);
    const g = el('g',{'clip-path':`url(#wc${i})`}, s2);
    const inner = el('g', null, g);
    const t = txt(inner, w, 150, y, 210, 800, '#fff', {'letter-spacing':-6});
    return {g:inner, t, y};
  });
  const sendiriW = words[2].t.getComputedTextLength();
  const period = el('circle',{cx:150+sendiriW+34, cy:840-24, r:26, fill:C.navy950}, s2);
  const subCp = el('clipPath',{id:'subc'}, defs); el('rect',{x:0,y:900,width:1500,height:70}, subCp);
  const subG = el('g',{'clip-path':'url(#subc)'}, s2);
  const sub2 = el('g', null, subG);
  txt(sub2, 'Laporkan dengan aman, langsung dari ponsel Anda.', 156, 950, 38, 700, '#fff', {'fill-opacity':.88});

  /* ================= stripes wipe ================= */
  const stripesG = el('g',{transform:'skewX(-20)'}, cam);
  const stripeCols = [C.blue600, C.teal, C.amber, C.violet, C.sky, C.coral, C.navy900];
  const stripes = stripeCols.map((c,i) => el('rect',{x:0,y:-100,width:430,height:1300,fill:c}, stripesG));

  /* ================= S3 — ALUR ================= */
  const s3 = el('g', null, cam);
  const s3inner = el('g', null, s3);
  const kick3 = txt(s3inner, 'ALUR PELAPOR', 150, 230, 24, 800, C.mag600, {'letter-spacing':5});
  const head3 = ['Dari QR', 'sampai tiket.'].map((s,i) => {
    const y = 330 + i*96;
    const cp = el('clipPath',{id:'h3c'+i}, defs); el('rect',{x:0,y:y-90,width:1000,height:116}, cp);
    const g = el('g',{'clip-path':`url(#h3c${i})`}, s3inner); const inner = el('g', null, g);
    txt(inner, s, 146, y, 92, 800, C.navy900, {'letter-spacing':-3});
    return inner;
  });
  const stepTrack = el('rect',{x:177,y:540,width:6,height:240,rx:3,fill:C.line}, s3inner);
  const stepFill = el('rect',{x:177,y:540,width:6,height:0,rx:3,fill:C.mag600}, s3inner);
  const stepLabels = ['Pindai QR Code','Isi formulir laporan','Diverifikasi Admin','Terima tiket & jadwal'];
  const steps = stepLabels.map((s,i) => {
    const y = 540 + i*80;
    const g = el('g', null, s3inner);
    const c = el('circle',{cx:180,cy:y,r:26,'stroke-width':3}, g);
    const n = txt(g, String(i+1).padStart(2,'0'), 180, y+8, 20, 800, C.inkMute, {'text-anchor':'middle'});
    const l = txt(g, s, 232, y+13, 38, 800, C.ink);
    return {g,c,n,l,y};
  });

  // phone
  const phone = el('g', null, s3inner);
  el('rect',{x:-210,y:-410,width:420,height:820,rx:64,fill:C.navy950}, phone);
  el('rect',{x:-196,y:-396,width:392,height:792,rx:52,fill:C.surface}, phone);
  const scr = el('g',{'clip-path':'url(#screenClip)'}, phone);
  const scrIn = el('g',{transform:'translate(-196 -396)'}, scr);
  el('rect',{x:-60,y:-386,width:120,height:28,rx:14,fill:C.navy950}, phone);

  // page: QR
  const pgQR = el('g', null, scrIn);
  txt(pgQR, 'Pindai untuk melapor', 196, 150, 27, 800, C.ink, {'text-anchor':'middle'});
  txt(pgQR, 'Arahkan kamera ke QR Code', 196, 184, 18, 400, C.inkMute, {'text-anchor':'middle'});
  const qrMods = []; const N=21, cell=13, qx=(392-N*cell)/2, qy=236;
  const r1 = rng(7);
  const finder = (i,j,ox,oy) => { const a=i-ox,b=j-oy; if(a<0||b<0||a>6||b>6) return null;
    return (a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4)); };
  for (let j=0;j<N;j++) for (let i=0;i<N;i++){
    let on = null;
    for (const [ox,oy] of [[0,0],[14,0],[0,14]]) { const f=finder(i,j,ox,oy); if (f!==null) on=f; }
    const nearF = (i<8&&j<8)||(i>12&&j<8)||(i<8&&j>12);
    const center = i>=8&&i<=12&&j>=8&&j<=12;
    if (on===null) on = !nearF && !center && r1()<.5;
    if (!on) continue;
    const x = qx+i*cell, y = qy+j*cell;
    qrMods.push({e: el('rect',{x:x+.5,y:y+.5,width:cell-1,height:cell-1,rx:2.5,fill:C.navy950}, pgQR),
      cx:x+cell/2, cy:y+cell/2, d: Math.hypot(i-10,j-10)/14.2});
  }
  const qrLogo = el('g', null, pgQR);
  el('rect',{x:196-30,y:qy+N*cell/2-30,width:60,height:60,rx:12,fill:'#fff'}, qrLogo);
  el('path',{d:'M56 218V124a72 72 0 0 1 144 0v94',fill:'none',stroke:C.navy900,'stroke-width':42,'stroke-linecap':'round',
    transform:`translate(196 ${qy+N*cell/2}) scale(.19) translate(-128 -135)`}, qrLogo);
  el('circle',{cx:128,cy:154,r:32,fill:C.mag600,transform:`translate(196 ${qy+N*cell/2}) scale(.19) translate(-128 -135)`}, qrLogo);
  const qrFrame = el('g',{fill:'none',stroke:C.mag600,'stroke-width':6,'stroke-linecap':'round'}, pgQR);
  const fq = [qx-18, qy-18, qx+N*cell+18, qy+N*cell+18];
  [`M${fq[0]} ${fq[1]+36}V${fq[1]}H${fq[0]+36}`,`M${fq[2]-36} ${fq[1]}H${fq[2]}V${fq[1]+36}`,
   `M${fq[2]} ${fq[3]-36}V${fq[3]}H${fq[2]-36}`,`M${fq[0]+36} ${fq[3]}H${fq[0]}V${fq[3]-36}`].forEach(d=>el('path',{d},qrFrame));
  const scanG = el('g', null, pgQR);
  el('rect',{x:qx-10,y:-60,width:N*cell+20,height:60,fill:'url(#scanGlow)'}, scanG);
  el('rect',{x:qx-14,y:-3,width:N*cell+28,height:5,rx:2.5,fill:C.mag600}, scanG);
  txt(pgQR, 'SIAP PPA · Lapor aman', 196, 620, 20, 700, C.navy900, {'text-anchor':'middle'});
  txt(pgQR, 'Tanpa akun, tanpa biaya', 196, 650, 17, 400, C.inkMute, {'text-anchor':'middle'});

  // page: form
  const pgForm = el('g', null, scrIn);
  el('rect',{x:0,y:0,width:392,height:120,fill:C.navy900}, pgForm);
  txt(pgForm, 'Lapor Kasus', 28, 96, 28, 800, '#fff');
  const field = (label, y) => { txt(pgForm, label, 28, y, 15, 700, C.inkMute);
    el('rect',{x:28,y:y+12,width:336,height:52,rx:12,fill:'#fff',stroke:C.line,'stroke-width':2}, pgForm);
    const v = txt(pgForm, '', 44, y+45, 19, 700, C.ink); const caret = el('rect',{x:44,y:y+26,width:2.5,height:24,fill:C.mag600}, pgForm);
    return {v, caret}; };
  const f1 = field('Nama (boleh samaran)', 166), f2 = field('Desa / Kelurahan', 256);
  txt(pgForm, 'Jenis kekerasan', 28, 352, 15, 700, C.inkMute);
  let cxp = 28; const chips = ['Fisik','Psikis','Seksual','Lainnya'].map(s => {
    const g = el('g', null, pgForm); const tt = txt(g, s, 0, 0, 16, 700, C.ink); const w = tt.getComputedTextLength()+30;
    const r = el('rect',{x:0,y:0,width:w,height:40,rx:20,fill:C.blue50,stroke:C.line,'stroke-width':2}, g); g.insertBefore(r, tt);
    set(tt,{x:w/2,y:26,'text-anchor':'middle'}); const ch = {g,r,tt,x:cxp,w}; cxp += w+8; return ch; });
  txt(pgForm, 'Ceritakan singkat', 28, 446, 15, 700, C.inkMute);
  el('rect',{x:28,y:458,width:336,height:140,rx:12,fill:'#fff',stroke:C.line,'stroke-width':2}, pgForm);
  const lines = [282,300,246,170].map((w,i)=>({w, e: el('rect',{x:46,y:482+i*24,width:0,height:10,rx:5,fill:C.lineStrong}, pgForm)}));
  txt(pgForm, 'Identitas Anda dirahasiakan.', 196, 648, 15, 700, C.teal, {'text-anchor':'middle'});
  const btn = el('g', null, pgForm);
  el('rect',{x:28,y:690,width:336,height:60,rx:14,fill:C.mag600}, btn);
  const ripple = el('circle',{cx:196,cy:720,r:0,fill:'#fff','fill-opacity':.35,'clip-path':'url(#btnClip)'}, btn);
  txt(btn, 'Kirim Laporan', 196, 727, 21, 800, '#fff', {'text-anchor':'middle'});

  // page: verify
  const pgVer = el('g', null, scrIn);
  el('rect',{x:0,y:0,width:392,height:792,fill:C.success50}, pgVer);
  const vRings = [0,1,2].map(()=>el('circle',{cx:196,cy:300,fill:'none',stroke:C.green}, pgVer));
  const vCircle = el('circle',{cx:196,cy:300,r:92,fill:C.green}, pgVer);
  const vCheck = el('path',{d:'M152 302 L184 334 L242 270',fill:'none',stroke:'#fff','stroke-width':18,'stroke-linecap':'round','stroke-linejoin':'round'}, pgVer);
  const chkLen = vCheck.getTotalLength(); vCheck.setAttribute('stroke-dasharray', chkLen+' '+chkLen);
  const vTxt = el('g', null, pgVer);
  txt(vTxt, 'Laporan diverifikasi', 196, 470, 27, 800, C.ink, {'text-anchor':'middle'});
  txt(vTxt, 'Tiket & jadwal segera terbit', 196, 506, 18, 400, C.inkMute, {'text-anchor':'middle'});
  el('rect',{x:116,y:540,width:160,height:40,rx:20,fill:'#fff',stroke:C.green,'stroke-width':2}, vTxt);
  txt(vTxt, 'TERVERIFIKASI', 196, 566, 15, 800, C.green, {'text-anchor':'middle','letter-spacing':2});

  // ticket
  const ticket = el('g', null, s3inner);
  const tk = el('g',{filter:'url(#shadow)'}, ticket);
  el('rect',{x:-290,y:-165,width:580,height:330,rx:26,fill:C.mag600}, tk);
  el('rect',{x:-150,y:-165,width:440,height:330,rx:26,fill:'#fff'}, tk);
  el('rect',{x:-150,y:-165,width:40,height:330,fill:'#fff'}, tk);
  el('line',{x1:-150,y1:-140,x2:-150,y2:140,stroke:C.lineStrong,'stroke-width':3,'stroke-dasharray':'2 10','stroke-linecap':'round'}, ticket);
  el('circle',{cx:-150,cy:-165,r:18,fill:C.canvas}, ticket); el('circle',{cx:-150,cy:165,r:18,fill:C.canvas}, ticket);
  txt(ticket, 'TIKET', -220, 0, 34, 800, '#fff', {'text-anchor':'middle','letter-spacing':8,transform:'rotate(-90 -220 0) translate(0 12)'});
  txt(ticket, 'NOMOR ANTREAN', -112, -98, 16, 800, C.inkMute, {'letter-spacing':3});
  txt(ticket, 'A-0', -116, 32, 104, 800, C.navy900, {'letter-spacing':-4});
  // posisi kolom diukur dari teks akhir "A-017" agar jarak antarangka sama dengan teks biasa
  const measure = s => { const m = txt(ticket, s, 0, 0, 104, 800, 'none', {'letter-spacing':-4}); const w = m.getComputedTextLength(); m.remove(); return w; };
  const odo = ['A-0','A-01'].map((prefix,k) => {
    const x = -116 + measure(prefix);
    const cp = el('clipPath',{id:'odo'+k}, defs); el('rect',{x:x-2,y:-56,width:76,height:104}, cp);
    const g = el('g',{'clip-path':`url(#odo${k})`}, ticket); const col = el('g', null, g);
    for (let n=0;n<20;n++) txt(col, String(n%10), x, 32 + n*130, 104, 800, C.navy900);
    return col; });
  txt(ticket, 'Kamis, 15 Oktober 2026 · 09.00 WIB', -112, 86, 19, 700, C.ink);
  txt(ticket, 'Sesi konseling psikologis', -112, 116, 17, 400, C.inkMute);
  const r2 = rng(11);
  for (let j=0;j<9;j++) for (let i=0;i<9;i++){
    const f = (i<3&&j<3)||(i>5&&j<3)||(i<3&&j>5); const on = f ? !(i%8===1&&j%8===1) && !((i===1||i===7)&&(j===1||j===7)) : r2()<.5;
    if (on) el('rect',{x:204+i*8,y:-142+j*8,width:7,height:7,rx:1.5,fill:C.navy950}, ticket);
  }
  const confG = el('g', null, s3); const r3 = rng(23);
  const confetti = Array.from({length:34}, (_,i) => {
    const a = -Math.PI/2 + (r3()-.5)*2.6, sp = 700 + r3()*900, kind = i%3, col = CONF[i%CONF.length], sz = 10+r3()*14;
    const e = kind===0 ? el('circle',{r:sz/2,fill:col}, confG) : kind===1 ? el('rect',{x:-sz/2,y:-sz/2,width:sz,height:sz,rx:4,fill:col}, confG)

        const c = E.inExpo(P(t,11.86 + d.dc*.16, 11.86 + d.dc*.16 + .32));
        set(d.e,{cx: lerp(d.x,960,c), cy: lerp(d.y,540,c), r: 12*s*(1-.7*c)});
      }
      const cg = E.spring(P(t,12.1,12.6)); show(coreDot, t>12.05);
      set(coreDot,{r: 48*cg});
    }

    /* ---- S5 ---- */
    const on5 = t>=12.32; show(s5, on5);
    if (on5){
      const m = E.inOutCubic(P(t,12.38,12.78));
      const pop = 1 + .12*Math.sin(Math.PI*P(t,12.7,12.95));
      set(dot5,{cx: lerp(960,DOT5.x,m), cy: lerp(540,DOT5.y,m) - 120*Math.sin(Math.PI*m), r: DOT5.r*pop});
      const ad = E.outExpo(P(t,12.62,13.25));
      [a5L,a5R].forEach(a=>a.setAttribute('stroke-dashoffset', archLen*(1-ad)));
      wm1.setAttribute('stroke-dashoffset', wl1*(1-E.inOutCubic(P(t,12.9,13.7))));
      wm2.setAttribute('stroke-dashoffset', wl2*(1-E.outCubic(P(t,13.35,13.85))));
      const ls = .94 + .06*E.spring(P(t,12.6,13.6));
      const drift = .015*P(t,13.6,15);
      lock.setAttribute('transform', `translate(960 470) scale(${ls+drift}) translate(-960 -470)`);
      dot5.setAttribute('transform', `translate(960 470) scale(${ls+drift}) translate(-960 -470)`);
      const rl = E.outExpo(P(t,13.55,14.1)); set(rule5,{x:960-70*rl, width:140*rl});
      [...tag1, ...tag2].forEach((w,i) => { const a = 13.6 + i*.035; const p = E.outExpo(P(t,a,a+.5));
        w.t.setAttribute('transform', `translate(0 ${34*(1-p)})`); w.t.setAttribute('opacity', p); });
      const pp = P(t,14.05,14.75); show(pulse5, pp>0&&pp<1);
      set(pulse5,{cx:DOT5.x, cy:DOT5.y, r: DOT5.r + 140*E.outExpo(pp), 'stroke-width': 6*(1-pp), 'stroke-opacity': 1-pp,
        transform:`translate(960 470) scale(${ls+drift}) translate(-960 -470)`});
    }

    /* ---- overlays ---- */
    if (!on3 && !on4) mblurG.setAttribute('stdDeviation','0 0');
    if (on3 && !on4) mblurG.setAttribute('stdDeviation', `${(46*Math.sin(Math.PI*P(t,9.18,9.56))).toFixed(1)} 0`);
    turb.setAttribute('seed', frame % 9 + 1);
    const light = t>=4.98 && t<9.36;
    vig.setAttribute('opacity', light ? .25 : 1);
    const hc = light ? C.ink : '#fff';
    hud.setAttribute('fill', hc); hudB.setAttribute('stroke', hc); hud.setAttribute('opacity', light ? .55 : .5);
    hBarBg.setAttribute('fill-opacity', .25); hBar.setAttribute('width', 1728*t/T); hBar.setAttribute('fill', light ? C.mag600 : C.pink);
    const ff = frame % FPS, ss = Math.floor(t);
    hTR.textContent = `00:00:${String(ss).padStart(2,'0')}:${String(ff).padStart(2,'0')}`;
    let lbl = SCENES[0][1]; for (const [a,l] of SCENES) if (t>=a) lbl = l; hBL.textContent = lbl;
    fade.setAttribute('opacity', E.inCubic(P(t,14.72,15)));
  };

  window.render = render;
  render(0);
  window.__ready = true;
}

/* ---------- playback ---------- */
init().then(() => {
  if (CAPTURE) return;
  const pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let playing = true, t0 = performance.now(), cur = 0;
  const toggle = () => { playing = !playing; pp.textContent = playing ? 'Jeda' : 'Putar'; if (playing) t0 = performance.now() - cur*1000; };
  pp.onclick = toggle; svg.onclick = toggle;
  addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); toggle(); } });
  scrub.oninput = () => { cur = +scrub.value; t0 = performance.now() - cur*1000; render(cur); tc.textContent = cur.toFixed(2); };
  (function loop(now){ if (playing){ cur = ((now - t0)/1000) % T; render(cur); scrub.value = cur; tc.textContent = cur.toFixed(2); } requestAnimationFrame(loop); })(performance.now());
});
})();
</script>
</body>
