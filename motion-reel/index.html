<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIAP PPA Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  :root { --bg:#05102b; --fg:#fff; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
  #wrap{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9}
  #stage{display:block;width:100%;height:100%;font-family:"Plus Jakarta Sans",system-ui,sans-serif;cursor:pointer}
  #ctl{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 16px;
       background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:opacity .25s;color:#fff;font:500 13px "JetBrains Mono",monospace}
  #wrap:hover #ctl{opacity:1}
  #ctl button{background:#048842;color:#fff;border:0;border-radius:8px;height:32px;min-width:64px;font:700 13px "Plus Jakarta Sans",sans-serif;cursor:pointer}
  #ctl input{flex:1;accent-color:#048842}
  .capture #ctl{display:none}
</style>
</head>
<body>
<div id="wrap">
  <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="ctl"><button id="pp">Jeda</button><input id="scrub" type="range" min="0" max="90" step="0.001" value="0"><span id="tc">00.00</span></div>
</div>
<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
const SH = 22;            // S4 dan S5 digeser sebesar ini karena adegan 3 diperpanjang
const TI = 24 + SH + 6, FPS = 30;   // lama linimasa animasi (detik internal), termasuk adegan logo penutup
/* Jeda untuk voice over: [waktu internal, lama jeda dalam detik]. Animasi berhenti di keadaan "sudah lengkap"
 * selama jeda (kamera tetap bernapas pelan), lalu lanjut. Ubah lama jeda di sini bila narasi lebih panjang atau pendek. */
const HOLDS = [
  [5.85, 2.0],                                   // 02 pesan: "Anda tidak sendiri"
  [9.75, 1.2],                                   // QR selesai dipindai
  [12.3, 2.2], [14.8, 2.2], [17.3, 2.2], [19.8, 2.2], [22.3, 2.4],  // lima langkah formulir
  [25.75, 2.0],                                  // kode pendaftaran dan tiket
  [29.3, 2.0], [30.7, 2.0], [32.1, 2.0], [34.15, 2.6],              // empat langkah offline di UPTD
  [16.38+SH, 3.5],                               // empat peran
  [18.48+SH, 2.2],                               // skala desa dan kelurahan
  [23.1+SH, 2.0]                                 // identitas
];
const TT = TI + HOLDS.reduce((s,[,d]) => s+d, 0);   // lama video sebenarnya
function toInt(r){ let acc = 0; for (const [h,d] of HOLDS){ if (r < h+acc) break; if (r < h+acc+d) return h; acc += d; } return r - acc; }
const CAPTURE = /capture/.test(location.search);
if (CAPTURE) document.documentElement.classList.add('capture');

/* ---------- palette (src/app/globals.css, palet hijau dari logo UPTD PPA) ---------- */
const C = {
  b950:'#062f1a', b900:'#0b3d22', b800:'#0f5a32', b700:'#046b35', b600:'#048842', b100:'#d6efdc', b50:'#ecf7ee',
  leaf:'#60ae2d', sun:'#f2b218', sun50:'#fff3d1',
  teal:'#0E9F8E', green:'#1E9E5A', amber:'#F5B014', violet:'#7A4FD6', sky:'#1E9BE0', coral:'#F26A4B',
  ink:'#1a2b22', inkMute:'#566a5d', canvas:'#f1f7f2', surface:'#fbfdfb', line:'#d8e6dc', lineStrong:'#b9d0c0',
  success50:'#E3F5EA'
};
const CONF = [C.b600, C.leaf, C.sun, C.teal, C.sky, C.violet, C.coral, C.b100];
const IMG_SIMBOL = '../public/brand/simbol.webp', IMG_LENGKAP = '../public/brand/siap-ppa-lengkap.webp';
const HEART_D = 'M50 88C20 66 0 48 0 28C0 12 12 0 27 0C38 0 46 6 50 15C54 6 62 0 73 0C88 0 100 12 100 28C100 48 80 66 50 88Z';

/* ---------- math ---------- */
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const lerp = (a,b,x) => a + (b-a)*x;
const P = (t,a,b) => clamp((t-a)/(b-a));
/* Bahasa gerak "hangat dan lembut": kurva sinus dan kubik tanpa lonjakan, pantulan, atau pegas. */
const E = {
  outSine: x => Math.sin(x*Math.PI/2),
  inOutSine: x => -(Math.cos(Math.PI*x)-1)/2,
  outCubic: x => 1-Math.pow(1-x,3),
  inCubic: x => x*x*x,
  inOutCubic: x => x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  outQuart: x => 1-Math.pow(1-x,4)
};
function rng(seed){ let s = seed>>>0; return () => { s = (s*1664525+1013904223)>>>0; return s/4294967296; }; }
function mix(a,b,x){ const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)); const A=h(a),B=h(b);
  return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(x))).toString(16).padStart(2,'0')).join(''); }

/* ---------- dom helpers ---------- */
const svg = document.getElementById('stage');
function el(tag, attrs, parent, text){ const e=document.createElementNS(NS,tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text!=null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
function set(e, attrs){ for (const k in attrs) e.setAttribute(k, attrs[k]); }
function show(e, on){ e.style.display = on ? '' : 'none'; }
function txt(parent, s, x, y, size, weight, fill, extra){ return el('text', Object.assign({x, y, 'font-size':size, 'font-weight':weight, fill}, extra||{}), parent, s); }
const TF = (x,y,s=1,r=0) => `translate(${x} ${y}) rotate(${r}) scale(${s})`;

let render = () => {};

async function init(){
  try { await Promise.all([
    document.fonts.load('800 100px "Plus Jakarta Sans"'), document.fonts.load('700 100px "Plus Jakarta Sans"'),
    document.fonts.load('400 100px "Plus Jakarta Sans"'), document.fonts.load('500 20px "JetBrains Mono"')]);
    await document.fonts.ready; } catch(e){}
  // potretan asli aplikasi (data dummy); ukurannya dibaca agar tinggi halaman mengikuti gambar
  const SHOTS = ['berhasil', ...[1,2,3,4,5].flatMap(k => ['kosong','isi'].map(v => `lapor-${k}-${v}`))].map(n => `layar/${n}.jpg`);
  const DIM = {};
  await Promise.all([IMG_SIMBOL, IMG_LENGKAP, ...SHOTS, ...['kabupaten-bandung','daldukppa','berakhlak','bandung-lebih-bedas'].map(n => `logo/${n}.png`)].map(async src => { const i = new Image(); i.src = src; await i.decode().catch(()=>{}); DIM[src] = [i.naturalWidth, i.naturalHeight]; }));

  /* ===== defs ===== */
  const defs = el('defs', null, svg);
  defs.innerHTML = `
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.b600}" stop-opacity="0"/><stop offset="1" stop-color="${C.b600}" stop-opacity=".35"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#062f1a" flood-opacity=".28"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <path id="ringPath" d="M1530,540 m-230,0 a230,230 0 1,1 460,0 a230,230 0 1,1 -460,0"/>
    <clipPath id="screenClip"><rect x="-196" y="-396" width="392" height="792" rx="52"/></clipPath>
    <clipPath id="btnClip"><rect x="28" y="690" width="336" height="60" rx="14"/></clipPath>`;

  const bg = el('rect', {x:-50,y:-50,width:2020,height:1180,fill:C.b950}, svg);
  const cam = el('g', null, svg);

  /* ================= S1 — NAUNGAN ================= */
  const s1 = el('g', null, cam);
  const grid = el('g', null, s1); const gridDots = [];
  for (let gy=0; gy<19; gy++) for (let gx=0; gx<33; gx++) {
    const x = gx*60, y = gy*60;
    gridDots.push({e: el('circle',{cx:x,cy:y,r:2.2,fill:'#fff'}, grid), d: Math.hypot(x-1027.4,y-506.8)});
  }
  // medali: simbol logo 440 px di tengah; titik jatuh = hati kuning, dipasang tepat di atas hati pada gambar
  const MED = {x:960, y:560, size:440}, ms = MED.size/512;
  const HEART = {x: MED.x - MED.size/2 + 334.5*ms, y: MED.y - MED.size/2 + 194.2*ms};
  const HS = .7, HR = -10;
  const rings1 = [C.sun, C.leaf, '#fff'].map(c => el('circle',{cx:HEART.x,cy:HEART.y,fill:'none',stroke:c}, s1));
  const zoom1 = el('g', null, s1);
  const disc1 = el('circle',{cx:MED.x,cy:MED.y,r:0,fill:C.surface}, zoom1);
  const arcPt = (a, r) => [MED.x + r*Math.cos(a*Math.PI/180), MED.y + 6*ms + r*Math.sin(a*Math.PI/180)];
  const [ax0, ay0] = arcPt(200, 235*ms), [ax1, ay1] = arcPt(370, 235*ms);
  const arc1 = el('path',{d:`M${ax0} ${ay0}A${235*ms} ${235*ms} 0 0 1 ${ax1} ${ay1}`,fill:'none',stroke:C.b600,'stroke-width':20*ms,'stroke-linecap':'round'}, zoom1);
  const arcLen = arc1.getTotalLength(); arc1.setAttribute('stroke-dasharray', arcLen+' '+arcLen);
  const m1 = el('mask',{id:'m1',maskUnits:'userSpaceOnUse',x:-6000,y:-6000,width:14000,height:14000}, defs);
  const m1c = el('circle',{cx:HEART.x,cy:HEART.y,r:0,fill:'#fff'}, m1);
  el('image',{href:IMG_SIMBOL,x:MED.x-MED.size/2,y:MED.y-MED.size/2,width:MED.size,height:MED.size,mask:'url(#m1)'}, zoom1);
  const heart1 = el('path',{d:HEART_D,fill:C.sun}, zoom1);
  // titik di dalam hati yang dijadikan pusat zoom (cukup jauh dari tepi hati)
  const hz = (() => { const a = HR*Math.PI/180, lx = 0, ly = 9*HS; return {x: HEART.x + lx*Math.cos(a) - ly*Math.sin(a), y: HEART.y + lx*Math.sin(a) + ly*Math.cos(a)}; })();

  /* ================= S2 — PESAN ================= */
  const s2 = el('g', null, cam);
  const ringG = el('g', null, s2);
  el('circle',{cx:1530,cy:540,r:262,fill:'none',stroke:C.b950,'stroke-opacity':.3,'stroke-width':2}, ringG);
  el('circle',{cx:1530,cy:540,r:198,fill:'none',stroke:C.b950,'stroke-opacity':.3,'stroke-width':2}, ringG);
  const ringTextG = el('g', null, ringG);
  const rt = el('text',{'font-size':30,'font-weight':800,fill:C.b950,'letter-spacing':7}, ringTextG);
  el('textPath',{href:'#ringPath'}, rt, 'SIAP PPA · KABUPATEN BANDUNG · ANDA TIDAK SENDIRI · ');
  const ringLogo = el('g', null, ringG);
  el('circle',{cx:256,cy:256,r:256,fill:C.surface}, ringLogo);
  el('image',{href:IMG_SIMBOL,x:46,y:46,width:420,height:420}, ringLogo);

  const words = [['Anda',400],['tidak',620],['sendiri',840]].map(([w,y],i) => {
    const cp = el('clipPath',{id:'wc'+i}, defs); el('rect',{x:0,y:y-205,width:1500,height:262}, cp);
    const g = el('g',{'clip-path':`url(#wc${i})`}, s2);
    const inner = el('g', null, g);
    const t = txt(inner, w, 150, y, 210, 800, C.b950, {'letter-spacing':-6});
    return {g:inner, t, y};
  });
  const sendiriW = words[2].t.getComputedTextLength();
  const PCX = 150+sendiriW+34, PCY = 840-24;
  const period = el('circle',{cx:PCX, cy:PCY, r:26, fill:C.b600}, s2);
  const subCp = el('clipPath',{id:'subc'}, defs); el('rect',{x:0,y:900,width:1500,height:70}, subCp);
  const subG = el('g',{'clip-path':'url(#subc)'}, s2);
  const sub2 = el('g', null, subG);
  txt(sub2, 'Laporkan dengan aman, langsung dari ponsel Anda.', 156, 950, 38, 700, C.b900);

  /* ================= mekar (transisi lembut ke S3) ================= */
  const bloomG = el('g', null, cam);
  const blooms = [C.sun50, C.b100, C.canvas].map(c => el('circle',{cx:960,cy:1500,r:0,fill:c}, bloomG));

  /* ================= S3 — LAPOR ONLINE (tampilan asli aplikasi, data dummy) ================= */
  const s3 = el('g', null, cam);
  const s3inner = el('g', null, s3);
  const kick3 = txt(s3inner, 'LANGKAH ONLINE · DARI PONSEL', 150, 190, 24, 800, C.b700, {'letter-spacing':5});
  const head3 = ['Lima langkah,', 'tanpa akun.'].map((s,i) => {
    const y = 282 + i*88;
    const cp = el('clipPath',{id:'h3c'+i}, defs); el('rect',{x:0,y:y-84,width:1000,height:112}, cp);
    const g = el('g',{'clip-path':`url(#h3c${i})`}, s3inner); const inner = el('g', null, g);
    txt(inner, s, 146, y, 84, 800, C.b900, {'letter-spacing':-3});
    return inner;
  });
  const LY0 = 470, LSP = 66;
  const stepTrack = el('rect',{x:177,y:LY0,width:6,height:6*LSP,rx:3,fill:C.line}, s3inner);
  const stepFill = el('rect',{x:177,y:LY0,width:6,height:0,rx:3,fill:C.b600}, s3inner);
  const stepLabels = ['Pindai QR Code','Data pelapor','Data korban','Tentang kejadian','Data terlapor','Dokumen & persetujuan','Kode & tiket'];
  const steps = stepLabels.map((s,i) => {
    const y = LY0 + i*LSP;
    const g = el('g', null, s3inner);
    const c = el('circle',{cx:180,cy:y,r:24,'stroke-width':3}, g);
    const n = txt(g, String(i+1).padStart(2,'0'), 180, y+7, 18, 800, C.inkMute, {'text-anchor':'middle'});
    const l = txt(g, s, 228, y+12, 34, 800, C.ink);
    return {g,c,n,l,y};
  });
  // detik mulai tiap butir daftar (tengah geser halaman di ponsel)
  const STEP_AT = [8.2, 10.1, 12.625, 15.125, 17.625, 20.125, 23.2];

  // ponsel
  const phone = el('g', null, s3inner);
  el('rect',{x:-210,y:-410,width:420,height:820,rx:64,fill:C.b950}, phone);
  el('rect',{x:-196,y:-396,width:392,height:792,rx:52,fill:C.surface}, phone);
  const scr = el('g',{'clip-path':'url(#screenClip)'}, phone);
  const scrIn = el('g',{transform:'translate(-196 -396)'}, scr);
  el('rect',{x:-40,y:-390,width:80,height:16,rx:8,fill:C.b950}, phone);

  // halaman 0: QR (gambar sendiri)
  const pgQR = el('g', null, scrIn);
  txt(pgQR, 'Pindai untuk melapor', 196, 150, 27, 800, C.ink, {'text-anchor':'middle'});
  txt(pgQR, 'Arahkan kamera ke QR Code', 196, 184, 18, 400, C.inkMute, {'text-anchor':'middle'});
  const qrMods = []; const N=21, cell=13, qx=(392-N*cell)/2, qy=236;
  const r1 = rng(7);
  const finder = (i,j,ox,oy) => { const a=i-ox,b=j-oy; if(a<0||b<0||a>6||b>6) return null;
    return (a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4)); };
  for (let j=0;j<N;j++) for (let i=0;i<N;i++){
    let on = null;
    for (const [ox,oy] of [[0,0],[14,0],[0,14]]) { const f=finder(i,j,ox,oy); if (f!==null) on=f; }
    const nearF = (i<8&&j<8)||(i>12&&j<8)||(i<8&&j>12);
    const center = i>=8&&i<=12&&j>=8&&j<=12;
    if (on===null) on = !nearF && !center && r1()<.5;
    if (!on) continue;
    const x = qx+i*cell, y = qy+j*cell;
    qrMods.push({e: el('rect',{x:x+.5,y:y+.5,width:cell-1,height:cell-1,rx:2.5,fill:C.b950}, pgQR),
      cx:x+cell/2, cy:y+cell/2, d: Math.hypot(i-10,j-10)/14.2});
  }
  const qrLogo = el('g', null, pgQR);
  el('rect',{x:196-31,y:qy+N*cell/2-31,width:62,height:62,rx:14,fill:'#fff'}, qrLogo);
  el('image',{href:IMG_SIMBOL,x:196-27,y:qy+N*cell/2-27,width:54,height:54}, qrLogo);
  const qrFrame = el('g',{fill:'none',stroke:C.b600,'stroke-width':6,'stroke-linecap':'round'}, pgQR);
  const fq = [qx-18, qy-18, qx+N*cell+18, qy+N*cell+18];
  [`M${fq[0]} ${fq[1]+36}V${fq[1]}H${fq[0]+36}`,`M${fq[2]-36} ${fq[1]}H${fq[2]}V${fq[1]+36}`,
   `M${fq[2]} ${fq[3]-36}V${fq[3]}H${fq[2]-36}`,`M${fq[0]+36} ${fq[3]}H${fq[0]}V${fq[3]-36}`].forEach(d=>el('path',{d},qrFrame));
  const scanG = el('g', null, pgQR);
  el('rect',{x:qx-10,y:-60,width:N*cell+20,height:60,fill:'url(#scanGlow)'}, scanG);
  el('rect',{x:qx-14,y:-3,width:N*cell+28,height:5,rx:2.5,fill:C.b600}, scanG);
  txt(pgQR, 'SIAP PPA · Lapor aman', 196, 620, 20, 700, C.b900, {'text-anchor':'middle'});
  txt(pgQR, 'Tanpa akun, tanpa biaya', 196, 650, 17, 400, C.inkMute, {'text-anchor':'middle'});

  // halaman 1-5: potretan asli formulir /lapor (kosong -> terisi), digulir pelan
  const SHOT_PAN = [380, 520, 560, 140, 1e5];
  const pgs = [1,2,3,4,5].map((k,idx) => {
    const g = el('g', null, scrIn), inner = el('g', null, g);
    const mk = v => { const src = `layar/lapor-${k}-${v}.jpg`, [w,h] = DIM[src];
      return {e: el('image',{href:src,x:0,y:0,width:392,height:h*392/w}, inner), h: h*392/w}; };
    const a = mk('kosong'), b = mk('isi');
    return {g, inner, a, b, pan: Math.min(SHOT_PAN[idx], Math.max(0, b.h-792))};
  });
  const btnH = pgs[4].b.h;
  const rpClip = el('clipPath',{id:'btnClip5'}, defs); el('rect',{x:146,y:btnH-64,width:230,height:52,rx:12}, rpClip);
  const ripple = el('circle',{cx:262,cy:btnH-38,r:0,fill:'#fff','fill-opacity':.35,'clip-path':'url(#btnClip5)'}, pgs[4].inner);
  // halaman 6: laporan diterima (potretan asli, dengan kode pendaftaran)
  const pgOK = el('g', null, scrIn);
  el('image',{href:'layar/berhasil.jpg',x:0,y:0,width:392,height:792}, pgOK);
  const PG = [pgQR, ...pgs.map(p=>p.g), pgOK];

  // panduan per halaman (di kanan ponsel)
  const CALL = [
    {tag:'LANGKAH 1 / 5', t:['Siapa yang','melapor?'], d:['Korbannya Anda sendiri?','Centang "Saya sendiri','korbannya".']},
    {tag:'LANGKAH 2 / 5', t:['Data korban'], d:['NIK 16 digit disimpan','terenkripsi. Alamat','domisili wajib diisi.']},
    {tag:'LANGKAH 3 / 5', t:['Tentang kejadian'], d:['Pilih jenis kekerasan.','Tanggal perkiraan boleh','bila tak ingat pasti.']},
    {tag:'LANGKAH 4 / 5', t:['Data terlapor','(tidak wajib)'], d:['Belum diketahui? Centang','"Pelaku belum diketahui"','dan lewati bagian ini.']},
    {tag:'LANGKAH 5 / 5', t:['Dokumen &','persetujuan'], d:['KK, KTP, dan akta','kelahiran wajib diunggah.','Lalu centang persetujuan.']}
  ];
  const callG = el('g', null, s3inner);
  const calls = CALL.map(c => {
    const g = el('g', null, callG);
    el('rect',{x:1500,y:400,width:360,height:276,rx:28,fill:'#fff',stroke:C.line,'stroke-width':2}, g);
    el('rect',{x:1500,y:430,width:8,height:216,rx:4,fill:C.b600}, g);
    txt(g, c.tag, 1536, 448, 17, 800, C.b700, {'letter-spacing':3});
    c.t.forEach((s,i)=>txt(g, s, 1536, 494+i*38, 32, 800, C.b900, {'letter-spacing':-.5}));
    c.d.forEach((s,i)=>txt(g, s, 1536, 494+(c.t.length-1)*38+44+i*30, 22, 500, C.inkMute));
    return g;
  });

  // tiket
  const ticket = el('g', null, s3inner);
  const tk = el('g',{filter:'url(#shadow)'}, ticket);
  el('rect',{x:-290,y:-165,width:580,height:330,rx:26,fill:C.b600}, tk);
  el('rect',{x:-150,y:-165,width:440,height:330,rx:26,fill:'#fff'}, tk);
  el('rect',{x:-150,y:-165,width:40,height:330,fill:'#fff'}, tk);
  el('line',{x1:-150,y1:-140,x2:-150,y2:140,stroke:C.lineStrong,'stroke-width':3,'stroke-dasharray':'2 10','stroke-linecap':'round'}, ticket);
  el('circle',{cx:-150,cy:-165,r:18,fill:C.canvas}, ticket); el('circle',{cx:-150,cy:165,r:18,fill:C.canvas}, ticket);

      const TR = [[9.8,10.4],[12.35,12.9],[14.85,15.4],[17.35,17.9],[19.85,20.4],[22.9,23.45]];

      PG.forEach((g,i) => { const d = i-pos; g.setAttribute('transform', `translate(${392*d} 0)`); show(g, Math.abs(d) < 1); });
      if (pos < 1){
        for (const m of qrMods){ const a = 8.3 + m.d*.6; const s = E.outCubic(P(t,a,a+.5));
          m.e.setAttribute('transform', `translate(${m.cx} ${m.cy}) scale(${.6+.4*s}) translate(${-m.cx} ${-m.cy})`); m.e.setAttribute('opacity', s); }
        qrLogo.setAttribute('opacity', E.outCubic(P(t,8.8,9.2)));
        const fr = E.outCubic(P(t,8.5,9.1));
        qrFrame.setAttribute('transform', `translate(196 ${qy+N*cell/2}) scale(${.9+.1*fr}) translate(-196 ${-(qy+N*cell/2)})`);
        qrFrame.setAttribute('opacity', fr);
        const sc = P(t,9.0,9.8); show(scanG, sc>0&&sc<1);
        scanG.setAttribute('transform', `translate(0 ${qy-6 + (N*cell+12)*E.inOutSine(sc)})`);
        scanG.setAttribute('opacity', Math.sin(Math.PI*sc));
      }
      pgs.forEach((p,i) => {
        const f = FK[i];
        p.b.e.setAttribute('opacity', E.inOutSine(P(t,f+.4,f+.8)));
        const w = i===4 ? [21.0,22.3] : [f+.8,f+1.9];
        p.inner.setAttribute('transform', `translate(0 ${-p.pan*E.inOutSine(P(t,w[0],w[1]))})`);
      });
      const tekan = P(t,22.4,22.65), rp = P(t,22.42,23.0);
      set(ripple,{r: 150*E.outCubic(rp), 'fill-opacity': .32*(1-rp)});
      // panduan di kanan ponsel
      const EXIT = [12.5, 15.0, 17.5, 20.0, 22.85];
      calls.forEach((g,i) => { const f = FK[i];
        const inn = E.outCubic(P(t,f+.15,f+.7)), out = E.inOutSine(P(t,EXIT[i],EXIT[i]+.35));
        g.setAttribute('transform', `translate(${30*(1-inn) - 20*out} 0)`); g.setAttribute('opacity', inn*(1-out)); show(g, inn>0 && out<1); });
      // tiket: melayang masuk dan berhenti pelan
      const te = E.outCubic(P(t,24.4,25.3)); show(ticket, t>24.4);
      ticket.setAttribute('transform', TF(lerp(1360,1120,te), lerp(620,650,te), lerp(.85,1,te), lerp(4,-6,te)));
      ticket.setAttribute('opacity', te);
      odo[0].setAttribute('transform', `translate(0 ${-130*E.outCubic(P(t,24.7,25.2))})`);
      odo[1].setAttribute('transform', `translate(0 ${-130*7*E.inOutCubic(P(t,24.7,25.7))})`);
      const onH = t>24.9 && t<26.6; show(heartsG, onH);
      if (onH) hearts.forEach(h => { const ht = t-25.0-h.delay, life = P(ht,0,1.7);
        const op = ht<=0 ? 0 : Math.min(E.outCubic(P(ht,0,.4)), 1-E.inOutSine(P(ht,1.1,1.7)));
        h.g.setAttribute('transform', `translate(${h.x + h.sway*Math.sin(h.ph+ht*2.4)} ${h.y - h.rise*Math.max(0,ht)}) rotate(${6*Math.sin(h.ph+ht*1.8)}) scale(${.7+.3*E.outCubic(life)})`);
        h.g.setAttribute('opacity', op); });
    }

    /* ---- S3b LANGKAH OFFLINE: datang ke UPTD ---- */
    const onB3 = t>=26.3 && t<36.7; show(s3b, onB3);
    if (onB3){
      const ex = E.inOutSine(P(t,36.0,36.65));
      s3bi.setAttribute('transform', `translate(${-80*ex} 0)`);
      s3b.setAttribute('opacity', E.inOutSine(P(t,26.3,26.8))*(1-ex));
      kickB.setAttribute('opacity', E.outCubic(P(t,26.7,27.3)));
      kickB.setAttribute('transform', `translate(${-20*(1-E.outCubic(P(t,26.7,27.3)))} 0)`);
      headB.forEach((h,i) => { const p = E.outCubic(P(t,26.8+i*.15,27.7+i*.15));
        h.setAttribute('transform', `translate(0 ${60*(1-p)})`); h.setAttribute('opacity', p); });
      const sb = E.outCubic(P(t,27.6,28.2)); subB.setAttribute('opacity', sb); subB.setAttribute('transform', `translate(0 ${20*(1-sb)})`);
      routeFill.setAttribute('stroke-dashoffset', 3*RDX*(1-P(t,28.4,32.6)));
      offN.forEach(n => { const pop = E.outCubic(P(t,n.at-.3,n.at+.5)), tx = E.outCubic(P(t,n.at+.1,n.at+.8));
        n.body.setAttribute('transform', `scale(${.6+.4*pop})`); n.body.setAttribute('opacity', pop);
        n.tx.setAttribute('transform', `translate(0 ${24*(1-tx)})`); n.tx.setAttribute('opacity', tx); });
      const nb = E.outCubic(P(t,33.4,34.1)); noteB.setAttribute('opacity', nb); noteB.setAttribute('transform', `translate(0 ${24*(1-nb)})`);
    }

    /* ---- S4 PERAN + SKALA ---- */
    { const t = tt - SH;
    const on4 = t>=14.7 && t<19.5; show(s4, on4);
    if (on4){
      const pin = E.inOutSine(P(t,14.75,15.5));
      s4inner.setAttribute('transform', `translate(${80*(1-pin)} 0)`);
      s4.setAttribute('opacity', pin);
      const hOut = E.inOutSine(P(t,16.5,17.1));
      head4.setAttribute('transform', `translate(0 ${-40*hOut})`); head4.setAttribute('opacity', 1-hOut);
      cards.forEach((c,i) => {
        const a = 15.0+i*.15; const ent = E.outCubic(P(t,a,a+.9));
        const lift = 12*Math.sin(Math.PI*P(t,15.9+i*.12,16.6+i*.12));
        const out = E.inOutSine(P(t,16.6+i*.08,17.3+i*.08));
        const y = 540 + 70*(1-ent) - lift + 60*out;
        c.g.setAttribute('transform', `translate(${c.x+180} ${y}) translate(-180 -230)`);
        c.g.setAttribute('opacity', ent*(1-out));
        c.shade.setAttribute('fill-opacity', 0);
      });
      show(s4b, t>16.9);
      const bIn = E.outCubic(P(t,17.0,17.7)), bOut = E.inOutSine(P(t,18.5,19.1));
      big.textContent = Math.round(280*E.outCubic(P(t,17.1,18.3)));
      big.setAttribute('transform', `translate(0 ${40*(1-bIn) - 30*bOut})`); big.setAttribute('opacity', bIn*(1-bOut));
      const lIn = E.outCubic(P(t,17.2,17.9));
      bigLbl.setAttribute('transform', `translate(0 ${30*(1-lIn) - 20*bOut})`); bigLbl.setAttribute('opacity', lIn*(1-bOut));
      for (const d of dots){
        const a = 17.1 + d.delay; const s = E.outCubic(P(t,a,a+.5));
        const c = E.inOutCubic(P(t,18.5 + d.dc*.3, 18.5 + d.dc*.3 + .8));
        set(d.e,{cx: lerp(d.x,960,c), cy: lerp(d.y,540,c), r: 12*s*(1-.7*c)});
      }
      show(coreDot, t>19.0); set(coreDot,{r: 48*E.outCubic(P(t,19.0,19.6))});
    }

    }

    /* ---- S5 IDENTITAS ---- */
    { const t = tt - SH;
    const on5 = t>=19.2 && t<24.2; show(s5, on5);
    if (on5){
      wipe5.setAttribute('r', 1150*E.inOutCubic(P(t,19.2,20.2)));
      // titik kuning meluncur pelan dari tengah ke titik di huruf "A"
      const m = E.inOutSine(P(t,19.4,20.3));
      set(dot5,{cx: lerp(960,ADOT.x,m), cy: lerp(540,ADOT.y,m) - 120*Math.sin(Math.PI*m), r: lerp(48,ADOT.r,E.inOutCubic(m))});
      const ls = .97 + .03*E.outCubic(P(t,20.2,21.2));
      const drift = .015*P(t,21,24);
      const camT = `translate(960 450) scale(${ls+drift}) translate(-960 -450)`;
      [lock, dot5].forEach(e => e.setAttribute('transform', camT));
      const wp = E.outCubic(P(t,20.2,21.0));
      set(m5word,{x: ADOT.x - (ADOT.x-L5.x)*wp, width: W5*wp});
      m5sym.setAttribute('r', 620*E.outCubic(P(t,20.4,21.3)));
      rings5.forEach((r,i) => { const p = P(t,20.4+i*.3,21.8+i*.3); show(r, p>0&&p<1);
        set(r,{r: 20+420*E.outSine(p), 'stroke-width': 5*(1-p), 'stroke-opacity': .7*(1-p)}); });
      m5tag.setAttribute('width', W5*E.outCubic(P(t,20.9,21.6)));
      const rl = E.outCubic(P(t,21.1,21.7)); set(rule5,{x:960-70*rl, width:140*rl});
      tag2.forEach((w,i) => { const a = 21.2 + i*.06; const p = E.outCubic(P(t,a,a+.7));
        w.t.setAttribute('transform', `translate(0 ${16*(1-p)})`); w.t.setAttribute('opacity', p); });
      const pp = P(t,21.9,23.0); show(pulse5, pp>0&&pp<1);
      set(pulse5,{cx:ADOT.x, cy:ADOT.y, r: ADOT.r + 80*E.outSine(pp), 'stroke-width': 4*(1-pp), 'stroke-opacity': .7*(1-pp), transform:camT});
    }

    }

    /* ---- S6 LOGO PENUTUP: empat logo masuk satu per satu ---- */
    const on6 = t>=45.3; show(s6, on6);
    if (on6){
      back6.setAttribute('opacity', E.inOutSine(P(t,45.3,46.0)));
      const k = E.outCubic(P(t,46.2,46.8));
      kick6.setAttribute('opacity', k); kick6.setAttribute('transform', `translate(0 ${16*(1-k)})`);
      const rl = E.outCubic(P(t,46.5,47.1)); set(rule6,{x:960-70*rl, width:140*rl});
      logos6.forEach((l,i) => { const p = E.outCubic(P(t,46.5+i*.3,47.3+i*.3));
        l.img.setAttribute('opacity', p); l.img.setAttribute('transform', `translate(0 ${24*(1-p)})`);
        if (l.div) l.div.setAttribute('opacity', p); });
    }

    /* ---- penutup ---- */
    fade.setAttribute('opacity', E.inOutSine(P(t,TI-.6,TI)));
  };

  window.render = render;
  window.__T = TT;
  render(0);
  window.__ready = true;
}

/* ---------- playback ---------- */
init().then(() => {
  if (CAPTURE) return;
  const pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  scrub.max = TT;
  let playing = true, t0 = performance.now(), cur = 0;
  const toggle = () => { playing = !playing; pp.textContent = playing ? 'Jeda' : 'Putar'; if (playing) t0 = performance.now() - cur*1000; };
  pp.onclick = toggle; svg.onclick = toggle;
  addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); toggle(); } });
  scrub.oninput = () => { cur = +scrub.value; t0 = performance.now() - cur*1000; render(cur); tc.textContent = cur.toFixed(2); };
  (function loop(now){ if (playing){ cur = ((now - t0)/1000) % TT; render(cur); scrub.value = cur; tc.textContent = cur.toFixed(2); } requestAnimationFrame(loop); })(performance.now());
});
})();
</script>
</body>
</html>
